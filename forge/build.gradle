plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id 'maven-publish'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true

        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "weaponleveling-common.mixins.json"
        mixinConfig "weaponleveling.mixins.json"
    }
    runs {
        client {
            runDir = "run/client"
        }
        server {
            runDir = "run/server"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"



    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixinextras_version}"))
    modImplementation (include ("maven.modrinth:midnightlib:${rootProject.midnightlib_version_forge}"))

//    modCompileOnly "maven.modrinth:better-combat:${rootProject.bettercombat_forge_version}" // Better Combat
//    modCompileOnly "maven.modrinth:cloth-config:${rootProject.clothconfig_forge_version}" // Cloth Config
//    modCompileOnly "maven.modrinth:playeranimator:${rootProject.playeranim_forge_version}" // playerAnimator

//    modCompileOnly "curse.maven:crayfishgun-289479:${rootProject.cgm_version}" //MrCrayfish's Gun Mod
//    modCompileOnly "curse.maven:framework-549225:${rootProject.framework_version}" //Framework
//
//
//    modCompileOnly "curse.maven:tinkers-74072:${rootProject.tinkers_version}" //Tinkers
//    modCompileOnly "curse.maven:mantle-74924:${rootProject.mantle_version}" //Mantle
//
//    modCompileOnly "curse.maven:parrythis-479996:${rootProject.parrythis_version}" //Parry This!
//
//    modCompileOnly "maven.modrinth:tetra:${rootProject.tetra_version}" //Tetra
//    modCompileOnly "maven.modrinth:mutil:${rootProject.mutil_version}" //mutil

    //modImplementation "curse.maven:improved-damage-framework-635505:${rootProject.improved_damage_framework_version}" //IDF


//    modCompileOnly "maven.modrinth:epic-fight:${rootProject.epic_fight_version}" // Epic Fight
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    mergeServiceFiles()
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "forge"
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = "forge"
            version = "${project.version}"

            if (tasks.findByName("remapJar") != null) {
                artifact(tasks.named("remapJar").get())
            } else if (tasks.findByName("reobfJar") != null) {
                artifact(tasks.named("reobfJar").get())
            } else {
                from components.java
            }

            if (tasks.findByName("remapSourcesJar") != null) {
                artifact(tasks.named("remapSourcesJar").get()) { classifier = "sources" }
            } else if (tasks.findByName("reobfSourcesJar") != null) {
                artifact(tasks.named("reobfSourcesJar").get()) { classifier = "sources" }
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/gekidolukas/weaponleveling")
            credentials {
                username = "GekidoLukas"
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
